name: Sincronizar stock

# Sincroniza las ventas al control de stock y responde las preguntas nuevas,
# cada 15 minutos, todos los días a toda hora.
#
# **Cada corrida se queda ~5 horas trabajando** (bucle_cron.py) en vez de
# hacer una pasada y terminar. El motivo: GitHub saltea en silencio los
# disparos programados frecuentes. Este `*/15` disparaba 52 veces por día
# hasta el 26/08/2026 y desde el 27/08 entre 1 y 5: las preguntas esperaban
# horas y el stock se actualizaba tarde. Ahora alcanza con que lleguen unos
# pocos disparos por día.
#
# Mientras una corrida está trabajando, los disparos que llegan quedan en
# espera (concurrency) y GitHub cancela los que se van acumulando: en la
# pestaña Actions se ven muchas corridas "cancelled". Es lo esperado, no una
# falla.
#
# **Minutos de Actions:** el repo es público, así que no tienen tope. Si algún
# día pasa a privado, el plan gratuito da 2.000 min/mes y esto se los comería
# en dos días: por eso, en un repo privado, cada corrida hace UNA sola pasada
# (como antes) en vez del bucle.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

concurrency:
  # Nunca dos a la vez: dos sincronizaciones simultáneas podrían renovar el
  # token de ML al mismo tiempo, y el refresh token es de un solo uso.
  group: sincronizar-stock
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # El límite de GitHub para un job es 6 horas; el bucle corta a las 5:30.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir los secrets
        env:
          SECRETS_TOML: ${{ secrets.CRAFTERS_SECRETS_TOML }}
        run: |
          if [ -z "$SECRETS_TOML" ]; then
            echo "Falta el secret CRAFTERS_SECRETS_TOML en el repositorio."
            exit 1
          fi
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Sincronizar ventas y responder preguntas, cada 15 minutos
        env:
          PRIVADO: ${{ github.event.repository.private }}
        run: |
          MINUTOS=330
          if [ "$PRIVADO" = "true" ]; then MINUTOS=0; fi
          python bucle_cron.py --cada 15 --minutos "$MINUTOS" -- \
            "python stock_control.py --dias 3" \
            "python preguntas_cron.py"

      - name: Limpiar credenciales
        if: always()
        run: rm -f .streamlit/secrets.toml
