name: Responder preguntas (a mano)

# Desde oct-2026 las preguntas se responden en sincronizar_stock.yml, cada 15
# minutos y a toda hora. Este workflow queda solo para correrlo a mano, por
# ejemplo con "Redactar sin publicar" para ver qué contestaría la IA.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Redactar sin publicar'
        type: boolean
        default: false

concurrency:
  # No se pisa consigo mismo ni con el sync de stock: procesar dos veces la
  # misma pregunta no la duplica (procesar() es idempotente por question_id)
  # pero gasta llamadas al modelo al pedo.
  group: responder-preguntas
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Escribir los secrets
        env:
          SECRETS_TOML: ${{ secrets.CRAFTERS_SECRETS_TOML }}
        run: |
          if [ -z "$SECRETS_TOML" ]; then
            echo "Falta el secret CRAFTERS_SECRETS_TOML."; exit 1
          fi
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Responder lo que se pueda
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            python preguntas_cron.py --simular
          else
            python preguntas_cron.py
          fi

      - name: Limpiar credenciales
        if: always()
        run: rm -f .streamlit/secrets.toml
